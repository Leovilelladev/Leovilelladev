<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mascote dragão minimalista de Leonardo Vilella</title>
  <desc id="desc">Um dragão noturno geométrico e simpático, com olhos verde-limão.</desc>

  <circle cx="256" cy="256" r="226" fill="#0D0F10" stroke="#D8F566" stroke-width="6"/>

  <!-- Silhueta única: asas e corpo usam a mesma linguagem visual. -->
  <path d="M160 272C132 237 102 218 72 217C91 239 98 261 94 285C119 280 140 290 159 309L176 286L160 272Z" fill="#1E2527"/>
  <path d="M352 272C380 237 410 218 440 217C421 239 414 261 418 285C393 280 372 290 353 309L336 286L352 272Z" fill="#1E2527"/>
  <path d="M146 450C151 405 180 374 219 357H293C332 374 361 405 366 450H146Z" fill="#232A2C"/>

  <!-- Cabeça, orelhas e chifres em uma única forma contínua. -->
  <path d="M256 132C232 111 205 93 178 84C177 112 185 139 198 158C156 178 129 214 129 258C129 332 181 386 256 386C331 386 383 332 383 258C383 214 356 178 314 158C327 139 335 112 334 84C307 93 280 111 256 132Z" fill="#2A3032"/>

  <!-- Um único plano de cor para as partes internas das orelhas. -->
  <path d="M190 132C187 119 186 108 187 99C204 108 218 119 231 132L210 151L190 132Z" fill="#9A62FF"/>
  <path d="M322 132C325 119 326 108 325 99C308 108 294 119 281 132L302 151L322 132Z" fill="#9A62FF"/>

  <!-- Olhos simples, grandes e expressivos. -->
  <ellipse cx="199" cy="231" rx="22" ry="29" fill="#D8F566"/>
  <ellipse cx="313" cy="231" rx="22" ry="29" fill="#D8F566"/>
  <ellipse cx="199" cy="235" rx="8" ry="17" fill="#0D0F10"/>
  <ellipse cx="313" cy="235" rx="8" ry="17" fill="#0D0F10"/>
  <circle cx="202" cy="225" r="4" fill="#F1F2EE"/>
  <circle cx="316" cy="225" r="4" fill="#F1F2EE"/>

  <!-- Focinho único, sem símbolo ou elemento tecnológico no peito. -->
  <path d="M185 291C205 273 232 269 256 282C280 269 307 273 327 291C312 333 286 351 256 351C226 351 200 333 185 291Z" fill="#F0E7D5"/>
  <path d="M241 290C248 284 264 284 271 290L265 303C260 307 252 307 247 303L241 290Z" fill="#0D0F10"/>
  <path d="M256 304V318C244 329 232 329 220 320M256 318C268 329 280 329 292 320" stroke="#0D0F10" stroke-width="5" stroke-linecap="round"/>

  <!-- Poucas marcas de escama, apenas para dar personalidade ao mascote. -->
  <circle cx="156" cy="286" r="5" fill="#D8F566"/>
  <circle cx="356" cy="286" r="5" fill="#D8F566"/>
  <circle cx="166" cy="307" r="3" fill="#9A62FF"/>
  <circle cx="346" cy="307" r="3" fill="#9A62FF"/>
</svg>

